services:
  - type: web
    name: pm-sim
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run serve
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: USERS_FILE
        value: /tmp/pm-sim-users.json
      - key: RUNS_FILE
        value: /tmp/pm-sim-runs.json
      - key: DATABASE_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
